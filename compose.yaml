x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DEBUG: ${DEBUG:-true}
    REDIS_URL: redis://redis:6379/0
  volumes:
    - data:/data

services:
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["python", "backend/manage.py", "migrate", "--noinput"]

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "backend", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  pages:
    <<: *app
    command: ["python", "backend/manage.py", "runserver", "0.0.0.0:8001"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  data:
