[project]
name = "flight-data-enrichment-service"
version = "0.1.0"
description = "FastAPI + Celery service that enriches submitted flights with a SerpApi price"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.test_settings"
pythonpath = [".", "backend"]
testpaths = ["api", "backend"]
python_files = ["tests.py", "test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/flights/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "backend", "flights"]
